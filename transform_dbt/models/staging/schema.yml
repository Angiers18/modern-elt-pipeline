version: 2

sources:
  - name: raw_data
    schema: main
    description: "Datos crudos extraídos de la API de Pokémon"
    tables:
      - name: raw_pokemons
        description: "Tabla con los 150 pokemons iniciales"

models:
  - name: stg_pokemons
    description: "Modelo staging limpio de los Pokémon"
    columns:
      - name: pokemon_id
        description: "Identificador único del Pokémon"
        tests:
          - unique
          - not_null
      - name: pokemon_name
        description: "Nombre del Pokémon en minúsculas"
        tests:
          - not_null
      - name: primary_type
        description: "Tipo principal del Pokémon"
        tests:
          - not_null